name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    name: Verify and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @ettrloz/theme-watcher exec oxlint
      - name: Format
        run: pnpm --filter @ettrloz/theme-watcher exec oxfmt --check .
      - name: Typecheck
        run: pnpm --filter @ettrloz/theme-watcher exec tsc --noEmit
      - name: Build
        run: pnpm --filter @ettrloz/theme-watcher build
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm --filter typescript-standard publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
